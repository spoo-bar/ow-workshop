[graph]
all-features = true

[advisories]
version = 2

# The repo is GPL-3.0; only allow licenses that can be combined with it.
[licenses]
version = 2
allow = [
    "GPL-3.0",
    "AGPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
