# Names and exclusions for `cargo xtask codegen` of `ow-workshop/src/generated/api.rs`.
# Values and actions are named in snake_case from their data key unless renamed here; a
# `module::name` target puts the function in a nested module.

[values]
getPlayers = "all_players"
"random.randint" = "random::int"
"random.uniform" = "random::real"
"random.choice" = "random::choice"
"random.shuffle" = "random::shuffle"
strIndex = "find"
substring = "slice"
isInLoS = "is_in_los"

# Reachable through hand-written API instead of generated code.
[skip]
actions = [
    "break",    # Block::break_
    "continue", # Block::continue_
    "loop",     # Block::loop_
    "wait",     # Block::wait, wait_with
    "waitUntil", # Block::wait_until
    "startRule", # Block::start_rule
]
values = [
    "attacker", "victim", "healer", "healee", "eventPlayer", "eventDamage", "eventHealing",
    "eventAbility", "eventDirection", "eventWasCriticalHit", "eventWasEnvironment",
    "eventWasHealthPack",           # Ev<E> methods
    "true", "false", "null", "vect", # literals
    "raycastHitNormal", "raycastHitPlayer", "raycastHitPosition", # ray_cast
]
