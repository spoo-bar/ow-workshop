[package]
name = "ow-workshop"
description = "Write Overwatch Workshop mods in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
ow-workshop-data = { path = "../ow-workshop-data", version = "0.1.0" }
ow-workshop-macros = { path = "../ow-workshop-macros", version = "0.1.0" }
ryu-js = "1"
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }

[dev-dependencies]
insta = "1"
serde_json = "1"
similar = "2"
trybuild = "1"
wasm-bindgen-test = "0.3"

# Not on wasm: its random-number and process dependencies do not build there.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
