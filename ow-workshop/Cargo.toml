[package]
name = "ow-workshop"
description = "Write Overwatch Workshop mods in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
ow-workshop-data = { path = "../ow-workshop-data", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
insta = "1"
similar = "2"
wasm-bindgen-test = "0.3"

[lints]
workspace = true
